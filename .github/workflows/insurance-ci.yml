name: Insurance UI API CI
on:
  workflow_dispatch:
  push:
    branches: [feature/insurance-ui-api-framework]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --config=playwright.insurance.config.ts --project=${{ matrix.browser }} --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insurance-${{ matrix.browser }}
          path: |
            insurance-report/
            insurance-results/
          if-no-files-found: warn
          retention-days: 14